[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-beacon"
version = "0.1.0"
description = "Claude Code harness installer and cost-savings report: force cheap hands under an expensive head"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "rok_root" }]
keywords = ["claude-code", "hooks", "cost", "subagent", "harness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
beacon = "beacon.cli:main"

[project.urls]
Homepage = "https://github.com/rok-root/beacon"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]
