name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests (stdlib only)
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: asset scan gate (no personal or company traces)
        run: PYTHONPATH=src python3 -m lapbar.cli bundle --check
      - name: hook self-tests
        run: |
          python3 src/lapbar/assets/hooks/subagent-model-guard.py --self-test </dev/null
          python3 src/lapbar/assets/hooks/git-push-guard.py --self-test </dev/null
          python3 src/lapbar/assets/hooks/git-readonly-guard.py --self-test </dev/null
